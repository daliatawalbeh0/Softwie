<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://js.stripe.com/v3/"></script>

</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">My Product Gallery</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" >Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>
    <main>
        <div class="gallery" id="home"></div>
        <section class="add-product" >
            <h3>Add Product</h3>
            <form id="productForm" enctype="multipart/form-data">
                <input type="text" id="productName" placeholder="Product Name" required />
                <textarea id="productDescription" placeholder="Product Description" required></textarea>
                <input type="number" id="productPrice" placeholder="Product Price" required />
                <input type="file" name="image" accept="image/*" required />
                <button type="submit">Add Product</button>
                
            </form>
        </section>
        <section class="form-container edit-product" style="display: none;">
            <h3>Edit Product</h3>
            <form id="editForm">
                <input type="text" id="editProductName" placeholder="Product Name" required />
                <textarea id="editProductDescription" placeholder="Product Description" required></textarea>
                <input type="number" id="editProductPrice" placeholder="Product Price" required />
                <input type="url" id="editProductImage" placeholder="Product Image URL"  />
                <button type="submit">Update Product</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Product Gallery</p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
